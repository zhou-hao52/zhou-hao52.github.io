  <path d="M11 45 L26 26 L36 36 L49 18" fill="none" stroke="#245D50" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="49" cy="18" r="6" fill="#35C9E0"/>
</svg>
